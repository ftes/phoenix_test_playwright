name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # As in CI.
  MIX_ENV: test

# Each job asks for what it needs.
permissions: {}

jobs:
  claude-review:
    # Claude's own PRs are the only bot PRs reviewed, and only this repository's PRs, never
    # Renovate's branches, whoever opened the PR. With an id-token, the review runs the PR branch's
    # setup code: only same-repository branches get here, and whoever can push one can already
    # give a pull_request workflow the secrets.
    if: >-
      !github.event.pull_request.draft &&
      !startsWith(github.head_ref, 'renovate/') &&
      (github.event.pull_request.user.type != 'Bot' || github.event.pull_request.user.login == 'claude[bot]') &&
      github.event.pull_request.head.repo.full_name == github.repository
    # The image main saves setup's deps cache from.
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Else checkout's read-only token can override the app token Claude pushes with: from v6
          # it sits in an includeIf file claude-code-action doesn't clear, so the push gets a 403.
          persist-credentials: false
          fetch-depth: 0
      # A rebase of reviewed changes skips the review; a later push can be reviewed by its
      # increment.
      - id: review
        uses: ftes/ci/claude-review@3b7244fd1eb84225fcf94fd3f7d6cad6bb40d5c4 # v1.0.11
        with:
          ci: "`mix format --check-formatted`, credo, `mix compile --warnings-as-errors`, Dialyzer, the docs build and the tests (.github/workflows/ci.yml)"
      # Soft, so a branch whose mix.exs, deps or code doesn't build still gets a Claude run.
      - name: Set up toolchain and deps
        if: steps.review.outputs.skip != 'true'
        continue-on-error: true
        uses: ftes/ci/setup@3b7244fd1eb84225fcf94fd3f7d6cad6bb40d5c4 # v1.0.11
      - name: Fetch Playwright source
        if: steps.review.outputs.skip != 'true'
        continue-on-error: true
        run: mix phoenix_test_playwright.playwright_source

      - if: steps.review.outputs.skip != 'true'
        uses: ftes/ci/claude@3b7244fd1eb84225fcf94fd3f7d6cad6bb40d5c4 # v1.0.11
        with:
          token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action refuses bot-triggered runs unless allowed; the if above admits only this one.
          allowed-bots: claude[bot]
          prompt: ${{ steps.review.outputs.prompt }}
          max-turns: "80"
          allowed-tools: "Skill,Read,Grep,Glob,Agent,Task,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view ${{ github.event.pull_request.number }}),Bash(gh pr view ${{ github.event.pull_request.number }} *),Bash(gh pr diff ${{ github.event.pull_request.number }}),Bash(gh pr diff ${{ github.event.pull_request.number }} *),Bash(gh pr comment ${{ github.event.pull_request.number }} *),Bash(gh pr review ${{ github.event.pull_request.number }} *),Bash(mix usage_rules.docs:*),Bash(mix usage_rules.search_docs:*),mcp__github_inline_comment__create_inline_comment"
