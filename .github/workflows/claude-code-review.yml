name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # As in elixir.yml.
  MIX_ENV: test
  # Runs subagents in the foreground. A headless run ends with Claude's turn, which drops any
  # still running in the background: the review ended waiting on its reviewers and posted nothing.
  CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
  # Steers Claude off the Bash habits (cd, pipes, heredocs) that miss the allowlist. Plain text
  # only (no quotes, $ or backslashes): claude.yml passes it in a quoted claude_args argument.
  TOOL_HINT: "Prefer your file tools over Bash to read, search and edit files, and keep any scratch files under tmp/; run each allowed Bash command on its own, without cd, git -C, semicolons, &&, pipes or heredocs (you are already in the repository). Give any subagent you start these same rules."
  # Denied in every Claude run: other repositories' PRs and issues, the comments and reviews (a job
  # that needs them gets its maintainers' from a step), API paths outside the allowed ones, and
  # mix's commands that run arbitrary code. Plain text, as TOOL_HINT.
  # These rules, the allowed tools and dontAsk steer Claude's tool use; they are no sandbox: a job
  # that lets Claude edit files and run mix lets it run code. What the jobs rely on is that none
  # loads another repository's content, the tokens' scopes, and main's ruleset.
  DENIED_TOOLS: "Bash(gh pr * -R*),Bash(gh pr * --repo*),Bash(gh issue * -R*),Bash(gh issue * --repo*),Bash(gh pr view *comments*),Bash(gh pr view *eview*),Bash(gh pr view * -c*),Bash(gh issue view *comments*),Bash(gh issue view * -c*),Bash(gh api *comments*),Bash(gh api *reviews*),Bash(gh api *timeline*),Bash(gh api graphql*),Bash(gh api *..*),Bash(gh api *%*),Bash(gh api * --hostname*),Bash(mix cmd*),Bash(mix run*),Bash(mix eval*),Bash(*mix cmd*)"

jobs:
  claude-review:
    # Claude's own PRs are the only bot PRs reviewed, and only this repository's PRs. Never
    # Renovate's branches, whoever opened the PR: the review would run their updated deps.
    if: >-
      !github.event.pull_request.draft &&
      !startsWith(github.head_ref, 'renovate/') &&
      (github.event.pull_request.user.type != 'Bot' || github.event.pull_request.user.login == 'claude[bot]') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A rebase of reviewed changes skips the rest; a later push can be reviewed by its increment.
      # Should it fail, Claude reviews it all.
      - name: Compare with the last review
        id: increment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/claude-review-increment.sh
      # The comments, reviews and review comments of maintainers and claude[bot], for the prompt;
      # Claude's tools can't read comments. Should it fail, the job fails before the review.
      - name: Collect maintainers' comments
        if: steps.increment.outputs.mode != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: bash .github/claude-review-comments.sh
      - name: Setup languages
        if: steps.increment.outputs.mode != 'skip'
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      # Soft, so a PR whose mix.exs, deps or code doesn't build still gets a Claude run.
      - name: Install dependencies
        if: steps.increment.outputs.mode != 'skip'
        continue-on-error: true
        run: mix "do" deps.get, deps.compile
      - name: Fetch Playwright's source
        if: steps.increment.outputs.mode != 'skip'
        continue-on-error: true
        run: mix phoenix_test_playwright.playwright_source

      - name: Run Claude Code Review
        if: steps.increment.outputs.mode != 'skip'
        id: claude
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude[bot]
          # dontAsk: a call no rule allows is denied, except the read-only ones Claude Code always allows.
          settings: |
            {"permissions": {"defaultMode": "dontAsk"}}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}
            BASE: origin/${{ github.base_ref }}
            LAST REVIEW: ${{ steps.increment.outputs.note }}

            Review this pull request like a senior maintainer of this codebase. The PR is checked
            out; read whatever you need.

            First pick the depth. With an earlier review, tmp/claude-review/increment.diff has what
            changed since. Review just the increment, and how it meets the rest of the PR, when it
            refines the PR within its design: fixes, follow-ups to findings, local changes. Review
            the whole PR when the increment changes its shape: new areas, a changed public API or
            behaviour, a different approach, or much of the PR rewritten. Read the whole diff
            either way. The steps below apply to what you review.

            ${{ env.TOOL_HINT }}

            1. Read AGENTS.md / CLAUDE.md (and the files they reference) for the project's rules.
               Read the PR description (`gh pr view PR`) and the diff (`git diff BASE...HEAD`).
            2. For every changed file, read the surrounding code, the callers and the tests, not
               just the hunks. A bug is usually in how the change meets existing code.
            3. Look for real defects: wrong behaviour, unhandled cases, broken invariants,
               authorization or data-exposure holes, races, data loss in migrations, tests that
               don't test what they claim, and violations of the project's written rules. Use
               subagents to review large or separate areas in parallel.
               Also review simplicity, consistency and scope, following the Reviewing guidance
               AGENTS.md gives or links: point at the existing code a change duplicates or
               departs from, or at the issue it goes beyond.
            4. Verify each candidate before reporting: trace the code path and state the concrete
               input or scenario that fails. Drop anything you cannot substantiate, and skip
               style, naming and formatting nits.
               Don't ask for handling of edge cases outside the PR's issue; list them in the
               summary as follow-ups.
               CI runs `mix format --check-formatted`, credo, `mix compile --warnings-as-errors`, dialyzer, the
               docs build and the tests. Do not run or approximate them, and do not comment on what they cover.
               Review what CI cannot catch: correctness, design and docs.
            5. Don't repeat findings already posted on this PR: tmp/claude-review/comments.md has
               its comments, reviews and review comments by maintainers and Claude.

            Post each verified finding as an inline comment on the relevant line
            (mcp__github_inline_comment__create_inline_comment, confirmed: true) in Conventional
            Comments syntax (https://conventionalcomments.org): start with
            `<label> [decorations]: <subject>`, then give the failure scenario and a suggested fix.
            The label is `issue` (a defect), `suggestion`, `question`, `nitpick`, `todo`,
            `thought`, `note` or `praise`; don't post praise alone. Decorate it `(blocking)` when
            it must be fixed before merge and `(non-blocking)` otherwise, e.g.
            `issue (blocking): ...` or `suggestion (non-blocking): ...`.

            Then post one new summary comment per review run with
            `gh pr comment PR --body-file <file>`. Open it with a verdict on the whole PR as it
            stands, counting earlier findings that are still open: `**Verdict: OK to merge.**`
            when nothing is blocking, noting any non-blocking ones (e.g.
            `**Verdict: OK to merge (2 non-blocking suggestions).**`), otherwise
            `**Verdict: Issues found: N blocking, M non-blocking.**`. The counts are of the inline
            comments' decorations; follow-ups in the summary don't count. An earlier finding is
            closed, not open, once the code fixes it, a maintainer declines it in a reply, or its
            thread is resolved (comments.md marks those). Then say which depth you chose and why,
            and in a few sentences what you checked and the most important findings (by their
            label), or why you found nothing. After an increment review, cover what changed since
            the last review and say in a line whether the earlier findings still hold, without
            repeating the earlier summary. End the comment with this line, verbatim:
            <!-- claude-review: ${{ steps.increment.outputs.head }} ${{ steps.increment.outputs.fork }} -->
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools "Read,Grep,Glob,Agent,Task,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view ${{ github.event.pull_request.number }}),Bash(gh pr view ${{ github.event.pull_request.number }} *),Bash(gh pr diff ${{ github.event.pull_request.number }}),Bash(gh pr diff ${{ github.event.pull_request.number }} *),Bash(gh pr comment ${{ github.event.pull_request.number }} *),Bash(mix usage_rules.docs:*),Bash(mix usage_rules.search_docs:*),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "${{ env.DENIED_TOOLS }}"
      - name: Summarize Claude's result
        if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        # .github/claude-summary.jq: only the final message and the denied calls (public repo). From
        # the run's commit, as Claude may have edited the checkout; a failed `git show` stops the step.
        run: |
          filter=$(git show "$GITHUB_SHA:.github/claude-summary.jq")
          jq -r "$filter" "$EXECUTION_FILE" >> "$GITHUB_STEP_SUMMARY"
