name: CI

on:
  push:
    branches: ["main"]
    # A release tag, from ftes/ci's release/release.exs: the publish job below releases it.
    tags: ["v*"]
  # Any base, so a PR stacked on another PR's branch gets CI too.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to a PR cancels its running CI. Pushes to main share a group without cancelling: the
# running CI finishes, the latest push to arrive waits (normally the newest), and pushes in
# between are dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job asks for what it needs.
permissions: {}

env:
  MIX_ENV: test
  PW_TIMEOUT: 4000

jobs:
  build:
    name: Build and lint
    # Draft PRs skip CI until marked ready, and in a stack only the top PR runs it (the tests need
    # this job): it holds every change below it. `stack` is absent outside a stack and on other events.
    # Tradeoffs (re-run CI on a PR that becomes the top): ftes/ci README, "Pull request CI".
    if: ${{ !github.event.pull_request.draft && (github.event.pull_request.stack == null || github.event.pull_request.stack.position == github.event.pull_request.stack.size) }}
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ftes/ci/setup@5820f5e1478671530b15466579268ddb941c127c # v1.0.8
        id: setup
      - name: Check Formatting
        run: mix format --check-formatted
      - name: Check Credo
        run: mix credo
      - name: Compiles without warnings
        run: mix compile --warnings-as-errors
      # After the compile proves the build; test (same MIX_ENV) restores it too.
      - name: Save deps and _build
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.setup.outputs.cache-key }}
          path: |
            deps
            _build
      - name: Check generated usage rules
        run: mix usage_rules.sync --check
      # The PLTs cover Erlang, Elixir and the deps; Dialyxir updates a restored older one. Keyed per
      # runner image and OTP build: a PLT from another is rejected as "Old PLT file".
      - name: Restore Dialyzer PLT cache
        id: plt_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: plt-${{ steps.setup.outputs.image }}-erlang-${{ steps.setup.outputs.erlang }}-${{ steps.setup.outputs.erlang-build }}-elixir-${{ steps.setup.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: plt-${{ steps.setup.outputs.image }}-erlang-${{ steps.setup.outputs.erlang }}-${{ steps.setup.outputs.erlang-build }}-elixir-${{ steps.setup.outputs.elixir }}-
          path: priv/plts
      - name: Create PLTs
        run: mix dialyzer --plt
      - name: Save PLT cache
        if: github.ref == 'refs/heads/main' && steps.plt_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.plt_cache.outputs.cache-primary-key }}
          path: priv/plts
      - name: Run Dialyzer
        run: mix dialyzer --format github --format dialyxir

  docs:
    name: Docs
    if: ${{ !github.event.pull_request.draft && (github.event.pull_request.stack == null || github.event.pull_request.stack.position == github.event.pull_request.stack.size) }}
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # `ex_doc` is a dev-only dependency.
      MIX_ENV: dev

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ftes/ci/setup@5820f5e1478671530b15466579268ddb941c127c # v1.0.8
        id: setup
      - name: Build docs without warnings
        run: mix docs --warnings-as-errors
      # The dev build, which only this job compiles.
      - name: Save deps and _build
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.setup.outputs.cache-key }}
          path: |
            deps
            _build

  # The newest lane runs the tests with warnings as errors. The oldest lane (the Elixir/OTP floor,
  # and every direct runtime dependency at its floor, in mix.lock.oldest) runs them with warnings
  # allowed: newer, backwards-compatible features may warn there, and the tests catch what the
  # floor lacks, as a call to a missing function only warns there.
  test:
    name: Test (${{ matrix.lane }})
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-4-ubuntu-2604' }}
    timeout-minutes: 30
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lane: [newest, oldest]

    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phoenix_test_playwright_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ftes/ci/setup@5820f5e1478671530b15466579268ddb941c127c # v1.0.8
        id: setup
        with:
          lane: ${{ matrix.lane }}
      # The browsers (headless shell only), assets and the test database: about 25 s in all, and
      # ftes/ci/playwright-browser can't pass --only-shell.
      - name: Install browsers and build assets
        run: mix setup
      # The oldest lane has no build job: it saves its own deps and _build, on main only, under the
      # key computed before deps.get.
      - name: Save deps and _build
        if: matrix.lane == 'oldest' && github.ref == 'refs/heads/main' && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.setup.outputs.cache-key }}
          path: |
            deps
            _build
      - name: Run tests
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
        # On exit 2, rerun the failures. ExUnit's manifest can lose them (a parameterize: module's
        # parameter sets share a test's entry, the last result wins), so a rerun of none fails.
        # Until Elixir 1.21: elixir-lang/elixir#15820.
        run: |
          retry() {
            mix test --failed --formatter ExUnit.CLIFormatter --formatter Playwright.Test.GitHubFormatter 2>&1 |
              tee retry.log
            s=${PIPESTATUS[0]}
            if grep -q "^There are no tests to run" retry.log; then
              echo "::error::mix test --failed found no failures to rerun after a failed run"; return 1
            fi
            return "$s"
          }
          strict=()
          if [[ $LANE == newest ]]; then strict=(--warnings-as-errors); fi
          mix test "${strict[@]}" --formatter ExUnit.CLIFormatter --formatter Playwright.Test.GitHubFormatter ||
            { [ $? -eq 2 ] && retry; }
      - name: Fail if screenshot on exit failed
        run: |
          if ! ls test-results/*/test-finished-*.png >/dev/null 2>&1; then
            echo "Screenshot on exit feature failed"
            exit 1
          fi
      - name: Fail if trace on exit failed
        run: |
          if ! ls test-results/*/trace.zip >/dev/null 2>&1; then
            echo "Trace on exit feature failed"
            exit 1
          fi
      - name: Upload test results (traces, screenshots)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Also after a retry passed: the first run's failures keep their traces.
        if: ${{ !cancelled() }}
        with:
          name: test-results-${{ matrix.lane }}
          path: ./test-results
          if-no-files-found: ignore

  # The one check to require: green when every job above is. A required check that GitHub skips
  # (`test` when `build` fails) counts as passed, so `Test` alone let a red build merge.
  quality:
    name: quality
    if: always()
    needs: [build, docs, test]
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      # On the step, so a draft or a PR below the top of its stack, whose jobs above are skipped,
      # reports it green rather than skipped.
      - if: ${{ !github.event.pull_request.draft && (github.event.pull_request.stack == null || github.event.pull_request.stack.position == github.event.pull_request.stack.size) }}
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A required job finished with: $result"
              exit 1
            fi
          done

  # A pushed vX.Y.Z tag (from ftes/ci's release/release.exs): publishes to Hex once every job
  # above passed on the tagged commit, then creates the GitHub release from CHANGELOG.md. Hex
  # authenticates the job by workload identity (hex.pm/docs/workload-identity): no API key. The
  # package's workload identity names this file and the `release` environment, so renaming either
  # breaks publishing. Staged publishing holds the release until an owner approves it on hex.pm
  # with 2FA; `--wait` blocks until then, so the GitHub release appears only once the Hex release
  # is live. Approve within the job's 6 h, or create the GitHub release by hand.
  publish:
    name: Publish to Hex and GitHub
    needs: quality
    # A tag push only, not another event that runs on a tag.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    environment: release
    timeout-minutes: 360
    permissions:
      contents: write # gh release create
      id-token: write # Hex workload identity
    env:
      # ex_doc, which hex.publish builds the docs with, is a dev dependency.
      MIX_ENV: dev
      RELEASE_TITLE: PhoenixTestPlaywright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # gh authenticates with GH_TOKEN; nothing pushes with git
      # mise installs precompiled Erlang (builds.hex.pm) only on the Ubuntu runners it detects (up
      # to 24.04) and compiles it from source, ~5 min, on newer ones. Drop once it detects this one.
      - name: Use precompiled Erlang
        run: | # zizmor: ignore[github-env] (only the runner's ImageOS digits)
          if [[ "${ImageOS:-}" =~ ^ubuntu([0-9]{2})$ ]]; then echo "MISE_ERLANG_PRECOMPILED_OS=ubuntu-${BASH_REMATCH[1]}.04" >> "$GITHUB_ENV"; fi
      # Not ftes/ci/setup, and no mise cache: a publishing job restores nothing another run saved.
      - name: Setup languages
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
      # Before publishing, so a wrong tag or a missing changelog entry stages nothing on Hex.
      - name: Check the tag and extract the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(sed -n 's/^  @version "\(.*\)"$/\1/p' mix.exs)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match @version $version in mix.exs"
            exit 1
          fi
          status=$(gh api "repos/$GH_REPO/compare/main...$GITHUB_SHA" --jq .status)
          if [ "$status" != identical ] && [ "$status" != behind ]; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi
          awk -v v="$version" '/^## /{if (f) exit; f = ($2 == v || $2 == "[" v "]"); next} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::No '## $version' section in CHANGELOG.md"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      # No HEX_API_KEY: with one set, Hex would use it instead of the workload identity.
      - name: Publish to Hex and wait for approval
        run: mix hex.publish --yes --wait
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag $prerelease \
            --title "$RELEASE_TITLE $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
