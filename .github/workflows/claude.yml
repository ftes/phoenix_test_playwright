name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

env:
  # As in CI.
  MIX_ENV: test

# Each job asks for what it needs.
permissions: {}

jobs:
  # A maintainer's `@claude`, never on Renovate's PRs. The action rejects anyone else too, but only
  # after the setup in `claude`. ftes/ci/claude-tag checks the comment's PR, before anything is
  # checked out.
  gate:
    if: |
      ((github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association) &&
      !startsWith(github.event.pull_request.head.ref, 'renovate/')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: read
      pull-requests: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
      other-repo: ${{ steps.gate.outputs.other-repo }}
      gh: ${{ steps.gate.outputs.gh }}
      comment-authors: ${{ steps.gate.outputs.comment-authors }}
    steps:
      - id: gate
        uses: ftes/ci/claude-tag@dd50f950cf260ef6a0c33110f9906dba13bed8c7 # v1.0.5

  # Says so on a PR from another repository, which `claude` skips.
  reply:
    needs: gate
    if: needs.gate.outputs.other-repo == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
          BODY: "`@claude` runs only on pull requests from this repository."
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$BODY"

  claude:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    # The image main saves setup's deps cache from.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    # Per issue or PR, on the job: every comment starts this workflow, and a run whose job is
    # skipped must not take the slot. One request waits for the running one; a newer one replaces
    # the waiting one.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # This PR's CI status (the action's get_ci_status); not other runs' logs.
    steps:
      # main for an issue or a comment, the PR's merge ref for a review; the action then switches
      # to the PR's branch.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Else checkout's read-only token can override the app token Claude pushes with: from v6
          # it sits in an includeIf file claude-code-action doesn't clear, so the push gets a 403.
          persist-credentials: false
          fetch-depth: 0
      # Soft, so a branch whose mix.exs, deps or code doesn't build still gets a Claude run.
      - name: Set up toolchain and deps
        continue-on-error: true
        uses: ftes/ci/setup@dd50f950cf260ef6a0c33110f9906dba13bed8c7 # v1.0.5
      - name: Fetch Playwright source
        continue-on-error: true
        run: mix phoenix_test_playwright.playwright_source

      # No prompt: Claude follows the comment that tagged it.
      - uses: ftes/ci/claude@dd50f950cf260ef6a0c33110f9906dba13bed8c7 # v1.0.5
        with:
          token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          comment-authors: ${{ needs.gate.outputs.comment-authors }}
          # This PR's CI status; the tools for other runs and their logs are denied.
          additional-permissions: |
            actions: read
          disallowed-tools: "mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log"
          system-prompt: "Tests can't run here; if your change needs them, say they haven't run."
          # Tag mode adds file, comment, CI and commit tools and allows edits inside the checkout.
          allowed-tools: "Skill,Agent,Task,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),${{ needs.gate.outputs.gh }},Bash(mix format:*),Bash(mix compile:*),Bash(mix credo:*),Bash(mix usage_rules.docs:*),Bash(mix usage_rules.search_docs:*)"
