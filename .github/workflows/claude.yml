name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

env:
  # Steers Claude off the Bash habits (cd, pipes, heredocs) that miss the allowlist. Plain text
  # only (no quotes, $ or backslashes): claude.yml passes it in a quoted claude_args argument.
  TOOL_HINT: "Prefer your file tools over Bash to read, search and edit files, and keep any scratch files under tmp/; run each allowed Bash command on its own, without cd, semicolons, &&, pipes or heredocs (you are already in the repository)."

jobs:
  claude:
    # Maintainers only, before any setup: the action rejects anyone else anyway. Review events
    # check out the PR's merge ref, so only same-repo PRs.
    if: |
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association) && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    env:
      # As in elixir.yml.
      MIX_ENV: test
    steps:
      # main for issues and issue comments, the PR's merge ref for review events.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Else checkout's read-only token, in an includeIf file the action doesn't clear,
          # overrides the app token and Claude's push gets a 403.
          persist-credentials: false
          fetch-depth: 0
      - name: Setup languages
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      # Soft, so a PR whose mix.exs, deps or code doesn't build still gets a Claude run.
      - name: Install dependencies
        continue-on-error: true
        run: mix "do" deps.get, deps.compile
      - name: Fetch Playwright's source
        continue-on-error: true
        run: mix phoenix_test_playwright.playwright_source
      # The action checks out a fork PR's head with a token that can push, and mix runs the
      # checked-out mix.exs and .formatter.exs: no mix tasks on a fork's code.
      - name: Allow mix tasks unless on a fork PR
        id: tools
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) }}
        run: |
          if [ -z "$PR" ] || [ "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)" = false ]; then
            echo "mix=,Bash(mix format:*),Bash(mix compile:*),Bash(mix credo:*),Bash(mix usage_rules.docs:*),Bash(mix usage_rules.search_docs:*)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # The owner forbids attribution.
          settings: |
            {"includeCoAuthoredBy": false, "attribution": {"commit": "", "pr": ""}}
          # Added to the action's defaults, which cover editing, committing and its comment.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 100
            --append-system-prompt "Tests can't run here: CI runs them on your push. ${{ env.TOOL_HINT }}"
            --allowedTools "Agent,Task,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*)${{ steps.tools.outputs.mix }}"
      - name: Summarize Claude's result
        if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        # The run's commit's filter, not the working tree's, which Claude can edit.
        run: |
          filter=$(git show "$GITHUB_SHA:.github/claude-summary.jq")
          jq -r "$filter" "$EXECUTION_FILE" >> "$GITHUB_STEP_SUMMARY"
