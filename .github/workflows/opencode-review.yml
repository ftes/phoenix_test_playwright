name: OpenCode Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, edited]

permissions: {}

env:
  MIX_ENV: test

jobs:
  review:
    # Setup runs the PR branch's code. Only same-repo branches get OIDC access.
    if: >-
      (github.event.action != 'edited' || github.event.changes.base.ref.from != null) &&
      !github.event.pull_request.draft &&
      !startsWith(github.head_ref, 'renovate/') &&
      (github.event.pull_request.user.type != 'Bot' ||
        contains(fromJSON('["claude[bot]","opencode-agent[bot]"]'), github.event.pull_request.user.login)) &&
      github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      # Let the publisher finish checking the submitted verdict against the current snapshot.
      cancel-in-progress: false
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 30
    permissions:
      contents: read
      # The runner exchanges OIDC for a separate OpenCode GitHub App token to publish and dismiss reviews.
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Dismiss superseded verdicts
        uses: ftes/ci/opencode@b4b5623a6415b2740137e9f42cc26c3ed1b4ec11 # ftes/ci#17
        with:
          mode: reconcile-reviews
      - uses: ftes/ci/opencode-install@b4b5623a6415b2740137e9f42cc26c3ed1b4ec11 # ftes/ci#17
      - id: auth
        uses: ftes/ci/opencode-auth@41939eef91514e8ac6b33a1d6e7923edc42f4628 # v1.0.14
        with:
          client-id: ${{ vars.OPENCODE_CLIENT_ID }}
      - name: Switch to the reviewed commit
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: git switch --detach "$HEAD"
      - name: Set up toolchain and deps
        continue-on-error: true
        uses: ftes/ci/setup@41939eef91514e8ac6b33a1d6e7923edc42f4628 # v1.0.14
      - name: Fetch Playwright source
        continue-on-error: true
        run: mix phoenix_test_playwright.playwright_source
      - name: Review and publish
        uses: ftes/ci/opencode@b4b5623a6415b2740137e9f42cc26c3ed1b4ec11 # ftes/ci#17
        with:
          mode: review
          model-token: ${{ steps.auth.outputs.token }}
          guidance: |
            CI covers formatting, Credo, compilation warnings, Dialyzer, the docs build, and tests.
            Review Playwright behavior against the pinned upstream sources in `tmp/playwright-*`.
            User-visible changes need a CHANGELOG.md entry; CI and internal changes do not.
