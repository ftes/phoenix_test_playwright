name: Sync usage rules

# `mix check` fails when an updated dep changes its usage rules, and Renovate can't run the sync
# itself, so this commits it to Renovate's branch. The jobs are ftes/ci's.
on:
  pull_request:
    paths: [mix.lock]

concurrency:
  group: usage-rules-${{ github.head_ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  sync:
    if: startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write # the commit job pushes the sync
      actions: write # and dispatches CI
    uses: ftes/ci/.github/workflows/usage-rules-sync.yml@41939eef91514e8ac6b33a1d6e7923edc42f4628 # v1.0.14
    with:
      runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
      skills-path: .agents/skills
      ci-workflow: ci.yml
