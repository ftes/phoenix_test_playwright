name: Elixir CI

on:
  push:
    branches: ["main"]
  # Any base, so a PR stacked on another PR's branch gets CI too.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to a PR cancels its running CI. Pushes to main share a group without cancelling: the
# running CI finishes, the newest push waits, and pushes in between are dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job asks for what it needs.
permissions: {}

env:
  MIX_ENV: test
  PW_TIMEOUT: 4000

jobs:
  build:
    name: Build and lint
    # Draft PRs skip CI until marked ready, and in a stack only the top PR runs it (the tests need
    # this job): it holds every change below it. `stack` is absent outside a stack and on other events.
    # Tradeoffs (re-run CI on a PR that becomes the top): ftes/ci README, "Pull request CI".
    if: ${{ !github.event.pull_request.draft && (github.event.pull_request.stack == null || github.event.pull_request.stack.position == github.event.pull_request.stack.size) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ftes/ci/setup@dd50f950cf260ef6a0c33110f9906dba13bed8c7 # v1.0.5
        id: setup
      - name: Check Formatting
        run: mix format --check-formatted
      - name: Check Credo
        run: mix credo
      - name: Compiles without warnings
        run: mix compile --warnings-as-errors
      # After the compile proves the build; test (same MIX_ENV) restores it too.
      - name: Save deps and _build
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.setup.outputs.cache-key }}
          path: |
            deps
            _build
      - name: Check generated usage rules
        run: mix usage_rules.sync --check
      # The PLTs cover Erlang, Elixir and the deps; Dialyxir updates a restored older one. Keyed per
      # runner image and OTP build: a PLT from another is rejected as "Old PLT file".
      - name: Restore Dialyzer PLT cache
        id: plt_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: plt-${{ steps.setup.outputs.image }}-erlang-${{ steps.setup.outputs.erlang }}-${{ steps.setup.outputs.erlang-build }}-elixir-${{ steps.setup.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: plt-${{ steps.setup.outputs.image }}-erlang-${{ steps.setup.outputs.erlang }}-${{ steps.setup.outputs.erlang-build }}-elixir-${{ steps.setup.outputs.elixir }}-
          path: priv/plts
      - name: Create PLTs
        run: mix dialyzer --plt
      - name: Save PLT cache
        if: github.ref == 'refs/heads/main' && steps.plt_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.plt_cache.outputs.cache-primary-key }}
          path: priv/plts
      - name: Run Dialyzer
        run: mix dialyzer --format github --format dialyxir

  docs:
    name: Docs
    if: ${{ !github.event.pull_request.draft && (github.event.pull_request.stack == null || github.event.pull_request.stack.position == github.event.pull_request.stack.size) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # `ex_doc` is a dev-only dependency.
      MIX_ENV: dev

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ftes/ci/setup@dd50f950cf260ef6a0c33110f9906dba13bed8c7 # v1.0.5
        id: setup
      - name: Build docs without warnings
        run: mix docs --warnings-as-errors
      # The dev build, which only this job compiles.
      - name: Save deps and _build
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.setup.outputs.cache-key }}
          path: |
            deps
            _build

  # The newest lane runs the tests with warnings as errors. The oldest lane (the Elixir/OTP floor,
  # and every direct runtime dependency at its floor, in mix.lock.oldest) runs them with warnings
  # allowed: newer, backwards-compatible features may warn there, and the tests catch what the
  # floor lacks, as a call to a missing function only warns there.
  test:
    name: Test (${{ matrix.lane }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lane: [newest, oldest]

    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phoenix_test_playwright_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ftes/ci/setup@dd50f950cf260ef6a0c33110f9906dba13bed8c7 # v1.0.5
        id: setup
        with:
          lane: ${{ matrix.lane }}
      # The browsers (headless shell only), assets and the test database: about 25 s in all, and
      # ftes/ci/playwright-browser can't pass --only-shell.
      - name: Install browsers and build assets
        run: mix setup
      # The oldest lane has no build job: it saves its own deps and _build, on main only, under the
      # key computed before deps.get.
      - name: Save deps and _build
        if: matrix.lane == 'oldest' && github.ref == 'refs/heads/main' && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.setup.outputs.cache-key }}
          path: |
            deps
            _build
      - name: Run tests
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
        # On exit 2, rerun the failures. ExUnit's manifest can lose them (a parameterize: module's
        # parameter sets share a test's entry, the last result wins), so a rerun of none fails.
        # Until Elixir 1.21: elixir-lang/elixir#15820.
        run: |
          retry() {
            mix test --failed --formatter ExUnit.CLIFormatter --formatter Playwright.Test.GitHubFormatter 2>&1 |
              tee retry.log
            s=${PIPESTATUS[0]}
            if grep -q "^There are no tests to run" retry.log; then
              echo "::error::mix test --failed found no failures to rerun after a failed run"; return 1
            fi
            return "$s"
          }
          strict=()
          if [[ $LANE == newest ]]; then strict=(--warnings-as-errors); fi
          mix test "${strict[@]}" --formatter ExUnit.CLIFormatter --formatter Playwright.Test.GitHubFormatter ||
            { [ $? -eq 2 ] && retry; }
      - name: Fail if screenshot on exit failed
        run: |
          if ! ls test-results/*/test-finished-*.png >/dev/null 2>&1; then
            echo "Screenshot on exit feature failed"
            exit 1
          fi
      - name: Fail if trace on exit failed
        run: |
          if ! ls test-results/*/trace.zip >/dev/null 2>&1; then
            echo "Trace on exit feature failed"
            exit 1
          fi
      - name: Upload test results (traces, screenshots)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Also after a retry passed: the first run's failures keep their traces.
        if: ${{ !cancelled() }}
        with:
          name: test-results-${{ matrix.lane }}
          path: ./test-results
          if-no-files-found: ignore

  # The one check to require: green when every job above is. A required check that GitHub skips
  # (`test` when `build` fails) counts as passed, so `Test` alone let a red build merge.
  quality:
    name: quality
    if: always()
    needs: [build, docs, test]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      # On the step, so a draft or a PR below the top of its stack, whose jobs above are skipped,
      # reports it green rather than skipped.
      - if: ${{ !github.event.pull_request.draft && (github.event.pull_request.stack == null || github.event.pull_request.stack.position == github.event.pull_request.stack.size) }}
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A required job finished with: $result"
              exit 1
            fi
          done
