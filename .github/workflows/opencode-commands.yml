name: OpenCode Commands

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions: {}

env:
  MIX_ENV: test

jobs:
  gate:
    # The runner validates the exact command, author, current permission and PR target.
    if: |
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association) &&
      (contains(github.event.comment.body || github.event.review.body || github.event.issue.body || '', '/agent') ||
        (github.event_name == 'issues' && contains(github.event.issue.title, '/agent')))
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      fork: ${{ steps.gate.outputs.fork }}
      pr: ${{ steps.gate.outputs.pr }}
      number: ${{ steps.gate.outputs.number }}
      branch: ${{ steps.gate.outputs.branch }}
    steps:
      - id: gate
        uses: ftes/ci/opencode@b4b5623a6415b2740137e9f42cc26c3ed1b4ec11 # ftes/ci#17
        with:
          mode: gate

  reply:
    needs: gate
    if: needs.gate.outputs.fork == 'true'
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.gate.outputs.number }}
          BODY: "`/agent` runs only on pull requests from this repository."
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$BODY"

  command:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 60
    concurrency:
      group: claude-${{ needs.gate.outputs.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      statuses: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ftes/ci/opencode-install@b4b5623a6415b2740137e9f42cc26c3ed1b4ec11 # ftes/ci#17
      - id: auth
        uses: ftes/ci/opencode-auth@0e4b067199ea2f6a255a26ab43403f6f6acb5cb6 # v1.0.12
        with:
          client-id: ${{ vars.OPENCODE_CLIENT_ID }}
      - name: Switch to the authorized worktree
        env:
          IS_PR: ${{ needs.gate.outputs.pr }}
          BRANCH: ${{ needs.gate.outputs.branch }}
        run: |
          if [[ "$IS_PR" == true ]]; then
            git switch --detach "origin/$BRANCH"
          else
            git switch -c "$BRANCH"
          fi
      - name: Set up toolchain and deps
        continue-on-error: true
        uses: ftes/ci/setup@3b7244fd1eb84225fcf94fd3f7d6cad6bb40d5c4 # v1.0.11
      - name: Restore the committed lockfile before running the command
        run: |
          if git cat-file -e HEAD:mix.lock 2>/dev/null; then
            git restore --source=HEAD --staged --worktree -- mix.lock
          else
            rm -f -- mix.lock
          fi
      - name: Fetch Playwright source
        continue-on-error: true
        run: mix phoenix_test_playwright.playwright_source
      - name: Run command and publish
        uses: ftes/ci/opencode@b4b5623a6415b2740137e9f42cc26c3ed1b4ec11 # ftes/ci#17
        with:
          mode: command
          branch: ${{ needs.gate.outputs.branch }}
          model-token: ${{ steps.auth.outputs.token }}
          guidance: |
            Check Playwright behavior against the pinned upstream sources in `tmp/playwright-*`.
