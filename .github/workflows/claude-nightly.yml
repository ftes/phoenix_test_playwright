name: OpenCode Nightly Improvement

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

# Keep the group stable across the migration.
concurrency:
  group: claude-nightly
  cancel-in-progress: false

permissions: {}

env:
  MIX_ENV: test
  BASE_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  triage_targets:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 30
    permissions:
      pull-requests: read
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - name: Snapshot open nightly PRs
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prs=$(gh pr list --state open --limit 1000 --json number,headRefName,headRefOid,baseRefName,isCrossRepository,comments,reviews \
            --jq '[.[] | select((.isCrossRepository | not) and .baseRefName == env.BASE_BRANCH
              and (.headRefName | test("^(claude|opencode)/nightly-[0-9]+(-[0-9]+)?$"))
              and all(.comments[]; .author.login | IN("claude", "opencode-agent", "coderabbitai"))
              and all(.reviews[]; (.author.login | IN("claude", "opencode-agent", "coderabbitai"))
                or (.author.login == "github-actions" and .state == "COMMENTED" and (.body // "") == "")))
              | {number, branch: .headRefName, head: .headRefOid}]')
          targets=$(jq -c . <<< "$prs")
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  triage:
    needs: triage_targets
    if: needs.triage_targets.outputs.targets != '' && needs.triage_targets.outputs.targets != '[]'
    permissions:
      contents: read
      actions: read
      pull-requests: write
      id-token: write
    uses: ftes/ci/.github/workflows/scheduled-candidate.yml@843b4ef16d0776013b95c2c9f31c3e9c67a818b0
    with:
      mode: triage
      base: ${{ github.event.repository.default_branch }}
      checkout-sha: ${{ github.sha }}
      client-id: ${{ vars.OPENCODE_CLIENT_ID }}
      runner: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
      key: triage
      targets: ${{ needs.triage_targets.outputs.targets }}
      prompt: |
        An earlier nightly run opened these simplification PRs, and main has moved on since.
        Check that each still makes sense on main as it is now. main is checked out.

        For each PR, Read the PR context and, on main, the code it touches, its
        callers and the patterns it follows. Then decide one of:

        - keep: the change still fits main. This is the default: when in doubt, keep it.
        - close: main made it obsolete or wrong. The code it simplifies is gone or rewritten,
          main already made the same change or solved the problem another way, or main changed
          the design it relies on, so the idea no longer holds.
        - redo: the idea still holds, but the diff no longer fits main as it is. For example,
          main changed the code it touches or its callers, renamed what it uses or added a use
          it misses, so merging it as is would break or leave the code inconsistent. A redo
          makes the same change again on a new branch from current main, which CI then tests.
          A change is redone at most once: a PR whose branch is `opencode/nightly-<run>-<old PR>` or its legacy `claude/` form,
          with two numbers, is itself a redo, so keep or close it.

        A merge conflict alone, the PR's age or a preference for other work is no reason for
        either: conflicts get redone anyway.

        Report closes and redos separately, with a one-sentence reason per PR. Omit keep decisions.

  classify:
    needs: triage
    if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      pull-requests: write # Recovers pending review thread resolutions.
      # Read by statusCheckRollup.
      actions: read
      checks: read
      statuses: read
    outputs:
      base: ${{ steps.list.outputs.base }}
      recreate: ${{ steps.list.outputs.recreate }}
      work: ${{ steps.work.outputs.work }}
    steps:
      - name: Sort open nightly PRs without human comments or reviews by what they need
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAX_COMMITS: 3
          # Triage's PRs to redo on current main; none if it failed.
          REDO: ${{ needs.triage.outputs.redo || '[]' }}
        # GitHub computes mergeability on the first read after main moves, answering UNKNOWN until
        # it's done. A human comment or review keeps a PR from being changed under them. A PR lists
        # every run of a check, so only each check's latest counts. Every fix or re-run adds a
        # commit, so the commit count limits the attempts. Listing commits caps --limit at 40: more
        # exceeds GitHub's GraphQL node limit. A PR to recreate (conflicted, or triage's redo) isn't
        # fixed as well: its replacement gets a CI run of its own. A PR out of fixes is given up on,
        # not redone, which would reset its fix budget.
        # A conflicting PR is recreated even if it is a redo: each conflict follows a change on main,
        # and the app can't push a merge or rebase, so the cap on redos is triage's alone.
        run: |
          list() {
            gh pr list --state open --limit 40 --json number,headRefName,headRefOid,baseRefName,isCrossRepository,mergeable,commits,statusCheckRollup,comments,reviews \
              --jq '[.[] | select((.isCrossRepository | not) and .baseRefName == env.BASE_BRANCH
                and (.headRefName | test("^(claude|opencode)/nightly-[0-9]+(-[0-9]+)?$"))
                and all(.comments[]; .author.login | IN("claude", "opencode-agent", "coderabbitai"))
                and all(.reviews[]; (.author.login | IN("claude", "opencode-agent", "coderabbitai"))
                  or (.author.login == "github-actions" and .state == "COMMENTED" and (.body // "") == "")))
                | {number, branch: .headRefName, head: .headRefOid, mergeable, commits: (.commits | length),
                   failing: ([.statusCheckRollup[] | select(.workflowName == "CI")] | group_by(.name)
                     | map(max_by(.startedAt)) | any(.conclusion == "FAILURE" or .conclusion == "TIMED_OUT"))}]'
          }
          base=$(gh api "repos/$GH_REPO/git/ref/heads/$BASE_BRANCH" --jq .object.sha)
          list > /dev/null
          sleep 30
          prs=$(list)
          exhausted=$(jq -c --argjson max "$MAX_COMMITS" 'map(select(.mergeable == "MERGEABLE" and .failing and .commits >= $max) | {number, branch, head})' <<< "$prs")
          # Triage's redo, if still open and listed (triage may have closed it, or a human commented
          # since), not out of fixes and not a redo itself (claude/nightly-<run>-<old PR>).
          recreate=$(jq -c --arg base "$base" --argjson redo "$REDO" --argjson exhausted "$exhausted" '. as $prs
            | ($redo | map(select(. as $r | .base == $base and ($prs | any(.number == $r.number and .head == $r.head and (.branch | test("^(claude|opencode)/nightly-[0-9]+-[0-9]+$") | not))) and ($exhausted | all(.number != $r.number)))))
              + map(select(.mergeable == "CONFLICTING") | {number, branch, head, base: $base, why: "It conflicts with the default branch."})
            | unique_by(.number)' <<< "$prs")
          others=$(jq -c --argjson recreate "$recreate" 'map(select(.number as $n | $recreate | all(.number != $n)))' <<< "$prs")
          mergeable=$(jq -c 'map(select(.mergeable == "MERGEABLE"))' <<< "$others")
          # Green PRs at the cap may answer findings on unchanged code.
          candidates=$(jq -c --argjson max "$MAX_COMMITS" 'map(select(.commits < $max or (.failing | not)) | {number, branch, head, failing, answer_only: (.commits >= $max)})' <<< "$mergeable")
          {
            echo "base=$base"
            echo "recreate=$recreate"
            echo "candidates=$candidates"
            echo "review-prs=$(jq -r 'map(.number) | join(" ")' <<< "$mergeable")"
            echo "exhausted=$exhausted"
          } >> "$GITHUB_OUTPUT"
      # The findings Claude's review and CodeRabbit left unresolved, which a ruleset requiring
      # resolved conversations blocks the merge on. Should it fail, only CI failures get fixed.
      - name: List open review findings
        id: threads
        if: steps.list.outputs.review-prs != ''
        continue-on-error: true
        uses: ftes/ci/review-threads@843b4ef16d0776013b95c2c9f31c3e9c67a818b0
        with:
          require-snapshot: true
          authors: claude opencode-agent coderabbitai
          prs: ${{ steps.list.outputs.review-prs }}
      - name: Pick the PRs to fix
        id: work
        env:
          CANDIDATES: ${{ steps.list.outputs.candidates || '[]' }}
          OPEN: ${{ steps.threads.outputs.open || '[]' }}
        run: echo "work=$(jq -cn --argjson open "$OPEN" 'env.CANDIDATES | fromjson | map(select(.failing or (.number as $n | $open | any(. == $n))))')" >> "$GITHUB_OUTPUT"
      - name: Exhaust
        id: exhaust
        if: steps.list.outputs.exhausted != '[]'
        continue-on-error: true
        uses: ftes/ci/opencode-scheduled@843b4ef16d0776013b95c2c9f31c3e9c67a818b0
        with:
          mode: exhaust
          client-id: ${{ vars.OPENCODE_CLIENT_ID }}
          base: ${{ env.BASE_BRANCH }}
          targets: ${{ steps.list.outputs.exhausted }}
      - name: Report exhaustion failure
        if: steps.exhaust.outcome == 'failure'
        run: echo "::warning::Could not finish closing or cleaning up exhausted nightly PRs. Independent repairs and recreations will proceed."

  fix:
    needs: classify
    if: needs.classify.outputs.work != '' && needs.classify.outputs.work != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.classify.outputs.work) }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
      id-token: write
    uses: ftes/ci/.github/workflows/scheduled-candidate.yml@843b4ef16d0776013b95c2c9f31c3e9c67a818b0
    with:
      mode: fix
      base: ${{ github.event.repository.default_branch }}
      checkout-sha: ${{ matrix.pr.head }}
      client-id: ${{ vars.OPENCODE_CLIENT_ID }}
      runner: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
      key: ${{ format('{0}', matrix.pr.number) }}
      targets: ${{ format('[{0}]', toJSON(matrix.pr)) }}
      review-pr: ${{ format('{0}', matrix.pr.number) }}
      prompt: |
        Fix the PR's CI failure and any review findings that hold. Read the saved PR
        metadata and diff, the findings file if present, and tmp/ci-failed.log if CI failed.
        Follow AGENTS.md and preserve the public behavior.
        Do not weaken a test or merge or rebase. A separate job checks the exact edits.
        Return fix with an imperative commit subject if you changed code; retry for an
        unrelated CI failure if you made no edits; give-up with a reason if a redesign is
        needed; or skip if CI passed and no changes are justified. For fix, retry or skip,
        answer every listed finding with its id, fixed boolean and short reply.

  recreate:
    needs: classify
    if: needs.classify.outputs.recreate != '' && needs.classify.outputs.recreate != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.classify.outputs.recreate) }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
      id-token: write
    uses: ftes/ci/.github/workflows/scheduled-candidate.yml@843b4ef16d0776013b95c2c9f31c3e9c67a818b0
    with:
      mode: recreate
      base: ${{ github.event.repository.default_branch }}
      checkout-sha: ${{ needs.classify.outputs.base }}
      client-id: ${{ vars.OPENCODE_CLIENT_ID }}
      runner: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
      key: ${{ format('{0}', matrix.pr.number) }}
      targets: ${{ format('[{0}]', toJSON(matrix.pr)) }}
      prompt: |
        Reason to redo: ${{ matrix.pr.why }}

        The old PR is a simplification that no longer fits main, for the reason in WHY. Redo it
        on the checked-out base.

        Read the saved PR metadata and diff for
        what it set out to do, then make the same change against the code as it is now, keeping
        what main has changed since and covering what WHY names. A separate job checks the exact edits. CI on the new PR
        runs the test suite.

        Return publish with the old title and an updated description, or give-up with a one-sentence reason.

  capacity:
    needs: [fix, recreate]
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      has-slot: ${{ steps.count.outputs.has-slot }}
      prs: ${{ steps.count.outputs.prs }}
    steps:
      - name: Count open nightly PRs
        id: count
        # With pipefail, so a failed lookup in the pipeline below shows.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAX_OPEN_PRS: 3
        # Same-repo branches only: a fork can pick any branch name, and this repo is public.
        run: |
          prs=$(gh pr list --state all --limit 1000 --json number,title,state,headRefName,isCrossRepository \
            --jq '[.[] | select((.isCrossRepository | not) and (.headRefName | test("^(claude|opencode)/nightly-[0-9]+(-[0-9]+)?$"))) | {number, title, state}]')
          open=$(jq '[.[] | select(.state == "OPEN")] | length' <<< "$prs")
          echo "::notice::$open of $MAX_OPEN_PRS nightly PRs open"
          if [ "$open" -lt "$MAX_OPEN_PRS" ]; then has_slot=true; else has_slot=false; fi
          # Why each closed PR was declined: its maintainers' comments and reviews, and the closing
          # comment of claude[bot] or github-actions[bot] (by REST, whose logins tell bots from
          # users). Only theirs reach the prompt.
          recent=$(jq -c '.[:30]' <<< "$prs")
          # shellcheck disable=SC2016 # jq's $closed and $bots
          for number in $(jq -r '.[] | select(.state == "CLOSED") | .number' <<< "$recent"); do
            why=$(gh pr view "$number" --json closedAt,comments,reviews > "$RUNNER_TEMP/pr.json" &&
              gh api --paginate "repos/$GH_REPO/issues/$number/comments" \
                --jq '.[] | select(.user.type == "Bot" and (.user.login | IN("claude[bot]", "opencode-agent[bot]", "github-actions[bot]"))) | {body, createdAt: .created_at}' |
                jq -s . > "$RUNNER_TEMP/bots.json" &&
              jq -c --slurpfile bots "$RUNNER_TEMP/bots.json" '(.closedAt | fromdate) as $closed
                | [.comments[], .reviews[] | select(.authorAssociation | IN("OWNER", "MEMBER", "COLLABORATOR"))]
                  + [$bots[0][] | select((.createdAt | fromdate) >= $closed - 120)]
                | map(.body | gsub("\\s+"; " ") | .[:300] | select(. != ""))' "$RUNNER_TEMP/pr.json") ||
              { echo "::warning::Couldn't read why #$number was closed."; why='[]'; }
            recent=$(jq -c --argjson n "$number" --argjson why "$why" 'map(if .number == $n then . + {why: $why} else . end)' <<< "$recent")
          done
          {
            echo "has-slot=$has_slot"
            echo "prs=$recent"
          } >> "$GITHUB_OUTPUT"

  improve_context:
    needs: capacity
    if: ${{ !cancelled() && needs.capacity.outputs.has-slot == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 5
    permissions: {}
    outputs:
      area: ${{ steps.focus.outputs.area }}
      prs: ${{ needs.capacity.outputs.prs }}
    steps:
      - name: Pick tonight's focus area
        id: focus
        # By day of the year, so successive nights look at different parts of the code.
        run: |
          areas=(
            "the public API: lib/phoenix_test/playwright.ex"
            "setup and browsers: case.ex, config.ex, internal/browser.ex"
            "selectors and helpers: selector.ex, internal/selector/, internal/cookie_args.ex, js_logger.ex"
            "the tests: test/phoenix_test/playwright/ and test/support/, outside the upstream mirrors"
          )
          area=${areas[$((10#$(date -u +%j) % ${#areas[@]}))]}
          echo "::notice::Focus: $area"
          echo "area=$area" >> "$GITHUB_OUTPUT"

  improve:
    needs: improve_context
    permissions:
      contents: read
      actions: read
      pull-requests: write
      id-token: write
    uses: ftes/ci/.github/workflows/scheduled-candidate.yml@843b4ef16d0776013b95c2c9f31c3e9c67a818b0
    with:
      mode: improve
      base: ${{ github.event.repository.default_branch }}
      checkout-sha: ${{ github.sha }}
      client-id: ${{ vars.OPENCODE_CLIENT_ID }}
      runner: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
      key: improve
      prompt: |
        Find the single most valuable improvement to this codebase's simplicity or consistency
        for one pull request, the kind a senior maintainer would be glad to merge.
        Pick it in or touching FOCUS: each night looks at a different part of the codebase.

        test/phoenix_test/upstream/ and test/support/upstream/web_app/ mirror upstream
        phoenix_test as a compatibility suite: leave them alone.

        1. Read AGENTS.md and enough of lib/ and test/ to know the prevailing patterns.
        2. Look for duplicated logic that belongs in one place, dead code, needless indirection
           or options, and one concept handled or named differently across modules.
        3. Rank the candidates by how much simpler or more uniform the code becomes for how
           little it changes. Read the callers and tests of the best one before committing to
           it. Skip anything overlapping an OPEN PR above or repeating a CLOSED one: those were
           declined, and `why` holds the reasons people gave.
        4. Implement that one idea, matching the surrounding code. Prefer a diff that removes
           more than it adds.

        Limits: observable public behaviour stays the same. No new features, bug fixes,
        dependency, CI or changelog changes, and no changes that are only formatting, comments
        or renames to taste.

        A separate job checks the exact edits. The full suite runs on the PR.

        If nothing is clearly worth a maintainer's time, stop without pushing and say why. No
        PR is a good result; a marginal PR is not.

        Return publish with one imperative sentence as title and a short PR body, or skip.

        Previous nightly PRs: ${{ needs.improve_context.outputs.prs }}
        Focus: ${{ needs.improve_context.outputs.area }}
