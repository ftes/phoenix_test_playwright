name: Claude Nightly Improvement

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

# One run at a time, so two runs can't both take the last slot.
concurrency:
  group: claude-nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  # As in elixir.yml.
  MIX_ENV: test
  # Runs subagents in the foreground. A headless run ends with Claude's turn, which drops any
  # still running in the background: the survey agents never reported back.
  CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
  # Steers Claude off the Bash habits (cd, pipes, heredocs) that miss the allowlist. Plain text
  # only (no quotes, $ or backslashes): claude.yml passes it in a quoted claude_args argument.
  TOOL_HINT: "Prefer your file tools over Bash to read, search and edit files, and keep any scratch files under tmp/; run each allowed Bash command on its own, without cd, git -C, semicolons, &&, pipes or heredocs (you are already in the repository). Give any subagent you start these same rules."
  # Denied in every Claude run: other repositories' PRs and issues, the comments and reviews (a job
  # that needs them gets its maintainers' from a step), API paths outside the allowed ones, and
  # mix's commands that run arbitrary code. Plain text, as TOOL_HINT.
  # These rules, the allowed tools and dontAsk steer Claude's tool use; they are no sandbox: a job
  # that lets Claude edit files and run mix lets it run code. What the jobs rely on is that none
  # loads another repository's content, the tokens' scopes, and main's ruleset.
  DENIED_TOOLS: "Bash(gh pr * -R*),Bash(gh pr * --repo*),Bash(gh issue * -R*),Bash(gh issue * --repo*),Bash(gh pr view *comments*),Bash(gh pr view *eview*),Bash(gh pr view * -c*),Bash(gh issue view *comments*),Bash(gh issue view * -c*),Bash(gh api *comments*),Bash(gh api *reviews*),Bash(gh api *timeline*),Bash(gh api graphql*),Bash(gh api *..*),Bash(gh api *%*),Bash(gh api * --hostname*),Bash(mix cmd*),Bash(mix run*),Bash(mix eval*),Bash(*mix cmd*)"

jobs:
  # Frees slots before the cap is counted. A job, not an earlier cron: GitHub delays scheduled
  # runs, and only `needs` guarantees the order.
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      id-token: write # Exchanged for the Claude app token, which closes the PRs.
    outputs:
      redo: ${{ steps.redo.outputs.redo }}
    steps:
      - name: List open nightly PRs without human comments or reviews
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # A human comment or review keeps a PR out of triage; Claude's own review doesn't. The
        # allowlist names each PR, so Claude can't read or close any other.
        run: |
          prs=$(gh pr list --state open --limit 1000 --json number,headRefName,isCrossRepository,comments,reviews \
            --jq '[.[] | select((.isCrossRepository | not) and (.headRefName | startswith("claude/nightly-")) and ([.comments[], .reviews[]] | all(.author.login == "claude"))) | {number, branch: .headRefName}]')
          numbers=$(jq -c 'map(.number)' <<< "$prs")
          {
            echo "numbers=$(jq -r 'join(" ")' <<< "$numbers")"
            echo "allowed=$(jq -r 'map("Bash(gh pr close \(.) *),Bash(gh pr view \(.)),Bash(gh pr view \(.) *),Bash(gh pr diff \(.)),Bash(gh pr diff \(.) *)") | join(",")' <<< "$numbers")"
            echo "listed=$(jq -r 'map("#\(.number) (\(.branch))") | join(", ")' <<< "$prs")"
          } >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        if: steps.list.outputs.numbers != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run Claude
        id: claude
        if: steps.list.outputs.numbers != ''
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            OPEN NIGHTLY PRS, each with its branch: ${{ steps.list.outputs.listed }}

            An earlier nightly run opened these simplification PRs, and main has moved on since.
            Check that each still makes sense on main as it is now. main is checked out.

            For each PR, read `gh pr view N`, `gh pr diff N` and, on main, the code it touches, its
            callers and the patterns it follows. Then decide one of:

            - keep: the change still fits main. This is the default: when in doubt, keep it.
            - close: main made it obsolete or wrong. The code it simplifies is gone or rewritten,
              main already made the same change or solved the problem another way, or main changed
              the design it relies on, so the idea no longer holds.
            - redo: the idea still holds, but the diff no longer fits main as it is. For example,
              main changed the code it touches or its callers, renamed what it uses or added a use
              it misses, so merging it as is would break or leave the code inconsistent. A redo
              makes the same change again on a new branch from current main, which CI then tests.
              A change is redone at most once: a PR whose branch is `claude/nightly-<run>-<old PR>`,
              with two numbers, is itself a redo, so keep or close it.

            A merge conflict alone, the PR's age or a preference for other work is no reason for
            either: conflicts get redone anyway.

            ${{ env.TOOL_HINT }}

            To close one, run exactly:
              gh pr close N --delete-branch --comment "<one sentence naming what on main made it obsolete>"

            Return the PRs to redo in `redo`, each with a one-sentence `why` naming what changed on
            main. Leave it empty if none.
          # dontAsk: a call no rule allows is denied, except the read-only ones Claude Code always allows.
          settings: |
            {"permissions": {"defaultMode": "dontAsk"}}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Agent,Task,StructuredOutput,Bash(git log:*),Bash(git show:*),Bash(git diff:*),${{ steps.list.outputs.allowed }}"
            --disallowedTools "${{ env.DENIED_TOOLS }}"
            --json-schema '{"type":"object","properties":{"redo":{"type":"array","items":{"type":"object","properties":{"number":{"type":"integer"},"why":{"type":"string"}},"required":["number","why"]}}},"required":["redo"]}'
      - name: Summarize Claude's result
        if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        # .github/claude-summary.jq: only the final message and the denied calls (public repo). From
        # the run's commit, as Claude may have edited the checkout; a failed `git show` stops the step.
        run: |
          filter=$(git show "$GITHUB_SHA:.github/claude-summary.jq")
          jq -r "$filter" "$EXECUTION_FILE" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the redo verdicts of listed PRs
        id: redo
        if: ${{ !cancelled() }}
        env:
          OUTPUT: ${{ steps.claude.outputs.structured_output }}
          NUMBERS: ${{ steps.list.outputs.numbers }}
        # Claude's answer is data: only the PRs it was given, and a `why` cut to one line.
        run: |
          redo=$(jq -cn --arg numbers "$NUMBERS" '($numbers | split(" ") | map(select(. != "") | tonumber)) as $listed
            | (env.OUTPUT | try fromjson catch {}) | (.redo // [])
            | map(select(.number as $n | $listed | any(. == $n)) | {number, why: (.why | tostring | gsub("\\s+"; " ") | .[:200])})
            | unique_by(.number)')
          echo "::notice::To redo: $(jq -r 'map("#\(.number)") | join(" ")' <<< "$redo")"
          echo "redo=$redo" >> "$GITHUB_OUTPUT"

  # After triage, so only PRs worth keeping get fixed.
  classify:
    needs: triage
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Deletes the branch of a PR given up on.
      pull-requests: write # Closes that PR.
      # Read by statusCheckRollup.
      actions: read
      checks: read
      statuses: read
    outputs:
      recreate: ${{ steps.list.outputs.recreate }}
      failing: ${{ steps.list.outputs.failing }}
    steps:
      - name: Sort open nightly PRs without human comments or reviews by what they need
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAX_COMMITS: 3
          # Triage's PRs to redo on current main; none if it failed.
          REDO: ${{ needs.triage.outputs.redo || '[]' }}
        # GitHub computes mergeability on the first read after main moves, answering UNKNOWN until
        # it's done. A human comment or review keeps a PR from being changed under them. A PR lists
        # every run of a check, so only each check's latest counts. Every fix or re-run adds a
        # commit, so the commit count limits the attempts. Listing commits caps --limit at 40: more
        # exceeds GitHub's GraphQL node limit. A PR to recreate (conflicted, or triage's redo) isn't
        # fixed as well: its replacement gets a CI run of its own. A PR out of fixes is given up on,
        # not redone, which would reset its fix budget.
        # A conflicting PR is recreated even if it is a redo: each conflict follows a change on main,
        # and the app can't push a merge or rebase, so the cap on redos is triage's alone.
        run: |
          list() {
            gh pr list --state open --limit 40 --json number,headRefName,isCrossRepository,mergeable,commits,statusCheckRollup,comments,reviews \
              --jq '[.[] | select((.isCrossRepository | not) and (.headRefName | startswith("claude/nightly-")) and ([.comments[], .reviews[]] | all(.author.login == "claude"))) | {number, branch: .headRefName, mergeable, commits: (.commits | length), failing: ([.statusCheckRollup[] | select(.workflowName == "Elixir CI")] | group_by(.name) | map(max_by(.startedAt)) | any(.conclusion == "FAILURE" or .conclusion == "TIMED_OUT"))}]'
          }
          list > /dev/null
          sleep 30
          prs=$(list)
          exhausted=$(jq -c --argjson max "$MAX_COMMITS" 'map(select(.mergeable == "MERGEABLE" and .failing and .commits >= $max) | .number)' <<< "$prs")
          # Triage's redo, if still open and listed (triage may have closed it, or a human commented
          # since), not out of fixes and not a redo itself (claude/nightly-<run>-<old PR>).
          recreate=$(jq -c --argjson redo "$REDO" --argjson exhausted "$exhausted" '. as $prs
            | ($redo | map(select(.number as $n | ($prs | any(.number == $n and (.branch | test("^claude/nightly-[0-9]+-[0-9]+$") | not))) and ($exhausted | all(. != $n)))))
              + map(select(.mergeable == "CONFLICTING") | {number, why: "It conflicts with main."})
            | unique_by(.number)' <<< "$prs")
          others=$(jq -c --argjson recreate "$recreate" 'map(select(.number as $n | $recreate | all(.number != $n)))' <<< "$prs")
          {
            echo "recreate=$recreate"
            echo "failing=$(jq -c --argjson max "$MAX_COMMITS" 'map(select(.mergeable == "MERGEABLE" and .failing and .commits < $max) | {number, branch})' <<< "$others")"
            echo "exhausted=$(jq -r 'join(" ")' <<< "$exhausted")"
          } >> "$GITHUB_OUTPUT"
      - name: Close PRs still failing after two fixes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBERS: ${{ steps.list.outputs.exhausted }}
        run: |
          for number in $NUMBERS; do
            gh pr close "$number" --delete-branch --comment "CI still fails after two automatic fixes."
          done

  # Pushes a fix to each PR whose CI failed, which is where a change gets tested: improve publishes
  # without running the suite. Only new commits, nothing merged from main, so no workflow files.
  fix:
    needs: classify
    if: ${{ !cancelled() && needs.classify.result == 'success' && needs.classify.outputs.failing != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # gh run view, for the failed log.
      id-token: write # Exchanged for the Claude app token.
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.classify.outputs.failing) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Else checkout's read-only token can override the app token Claude pushes with: from v6
          # it sits in an includeIf file claude-code-action doesn't clear, so the push gets a 403.
          persist-credentials: false
          ref: ${{ matrix.pr.branch }}
          fetch-depth: 0
      # mise installs precompiled Erlang (builds.hex.pm) only on the Ubuntu runners it detects (up
      # to 24.04) and compiles it from source, ~5 min, on newer ones. Drop once it detects this one.
      - name: Use precompiled Erlang
        run: | # zizmor: ignore[github-env] (only the runner's ImageOS digits)
          if [[ "${ImageOS:-}" =~ ^ubuntu([0-9]{2})$ ]]; then echo "MISE_ERLANG_PRECOMPILED_OS=ubuntu-${BASH_REMATCH[1]}.04" >> "$GITHUB_ENV"; fi
      - name: Setup languages
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: Install dependencies
        run: mix "do" deps.get, deps.compile
      # Compiles the project to find the task: a PR that doesn't compile still gets a Claude run.
      - name: Fetch Playwright's source
        continue-on-error: true
        run: mix phoenix_test_playwright.playwright_source
      - name: Save the failed CI log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ matrix.pr.branch }}
        # This repository's runs of the checked-out commit only.
        run: |
          head=$(git rev-parse HEAD)
          # shellcheck disable=SC2016 # jq's $ENV
          run=$(gh api "repos/$GH_REPO/actions/workflows/elixir.yml/runs?branch=$BRANCH&head_sha=$head&event=pull_request&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_repository.full_name == $ENV.GH_REPO)][0].id // empty')
          if [[ -z $run ]]; then echo "::error::no CI run of $BRANCH at $head"; exit 1; fi
          mkdir -p tmp
          gh run view "$run" --log-failed | tail -n 5000 > tmp/ci-failed.log
      - name: Run Claude
        id: claude
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ matrix.pr.number }}
            BRANCH: ${{ matrix.pr.branch }} (already checked out)

            CI failed on this simplification PR. The end of the failed steps' log is in
            tmp/ci-failed.log (tmp/ is gitignored).

            Read it along with `gh pr view ${{ matrix.pr.number }}` and
            `gh pr diff ${{ matrix.pr.number }}` and find the cause. Tests can't run here: CI runs
            them on your push. Don't merge or rebase on main. End with exactly one of these:

            - The PR caused it: fix it, keeping what the PR set out to do and the public behaviour,
              and matching the surrounding code. Don't weaken or skip a test to get it green. Run
              `mix format`, `mix compile --warnings-as-errors` and `mix credo`, `git add` the files,
              commit with one imperative sentence as the subject (match `git log`), then run exactly:
                git push origin ${{ matrix.pr.branch }}
            - It is unrelated to this PR, like a flaky browser test: run exactly
              `git commit --allow-empty -m "Re-run CI"`, then the push above.
            - It can't be fixed without redesigning the change: run exactly
              gh pr close ${{ matrix.pr.number }} --delete-branch --comment "<one sentence on why>"

            ${{ env.TOOL_HINT }}

            No attribution anywhere: no Co-Authored-By trailers or "Generated with" lines.
          # The owner forbids attribution; the prompt says so too. dontAsk: a call no rule allows is denied, except the read-only ones Claude Code always allows.
          settings: |
            {"includeCoAuthoredBy": false, "attribution": {"commit": "", "pr": ""}, "permissions": {"defaultMode": "dontAsk"}}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(mix format:*),Bash(mix compile:*),Bash(mix usage_rules.docs:*),Bash(mix usage_rules.search_docs:*),Bash(mix credo:*),Bash(gh pr view ${{ matrix.pr.number }}),Bash(gh pr view ${{ matrix.pr.number }} *),Bash(gh pr diff ${{ matrix.pr.number }}),Bash(gh pr diff ${{ matrix.pr.number }} *),Bash(git push origin ${{ matrix.pr.branch }}),Bash(gh pr close ${{ matrix.pr.number }} *)"
            --disallowedTools "${{ env.DENIED_TOOLS }}"
      - name: Summarize Claude's result
        if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        # .github/claude-summary.jq: only the final message and the denied calls (public repo). From
        # the run's commit, as Claude may have edited the checkout; a failed `git show` stops the step.
        run: |
          filter=$(git show "$GITHUB_SHA:.github/claude-summary.jq")
          jq -r "$filter" "$EXECUTION_FILE" >> "$GITHUB_STEP_SUMMARY"

  # Replaces each conflicted PR, and each that triage found no longer fits main, with one on a new
  # branch from main. The Claude app can't push workflow file changes, which a merge or rebase of
  # the old branch would carry from main.
  recreate:
    needs: classify
    if: ${{ !cancelled() && needs.classify.result == 'success' && needs.classify.outputs.recreate != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # Exchanged for the Claude app token.
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.classify.outputs.recreate) }}
    env:
      NIGHTLY_BRANCH: claude/nightly-${{ github.run_id }}-${{ matrix.pr.number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Else checkout's read-only token can override the app token Claude pushes with: from v6
          # it sits in an includeIf file claude-code-action doesn't clear, so the push gets a 403.
          persist-credentials: false
          fetch-depth: 0
      # mise installs precompiled Erlang (builds.hex.pm) only on the Ubuntu runners it detects (up
      # to 24.04) and compiles it from source, ~5 min, on newer ones. Drop once it detects this one.
      - name: Use precompiled Erlang
        run: | # zizmor: ignore[github-env] (only the runner's ImageOS digits)
          if [[ "${ImageOS:-}" =~ ^ubuntu([0-9]{2})$ ]]; then echo "MISE_ERLANG_PRECOMPILED_OS=ubuntu-${BASH_REMATCH[1]}.04" >> "$GITHUB_ENV"; fi
      - name: Setup languages
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: Install dependencies and Playwright's source
        run: mix "do" deps.get, deps.compile, phoenix_test_playwright.playwright_source
      - run: git switch -c "$NIGHTLY_BRANCH"
      - name: Run Claude
        id: claude
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            OLD PR: ${{ matrix.pr.number }}
            WHY: ${{ matrix.pr.why }}
            BRANCH: ${{ env.NIGHTLY_BRANCH }} (already checked out, from current main)

            The old PR is a simplification that no longer fits main, for the reason in WHY. Redo it
            on this branch.

            Read `gh pr view ${{ matrix.pr.number }}` and `gh pr diff ${{ matrix.pr.number }}` for
            what it set out to do, then make the same change against the code as it is now, keeping
            what main has changed since and covering what WHY names. Run `mix format`,
            `mix compile --warnings-as-errors` and `mix credo`; they must pass. CI on the new PR
            runs the test suite.

            If the change can't be redone without redesigning it, don't push. Close the old PR
            instead, so it isn't retried every night, with exactly:
              gh pr close ${{ matrix.pr.number }} --delete-branch --comment "<one sentence on why it can't be redone>"

            To publish, commit with the old PR's title as the subject, write tmp/nightly-pr.md (the
            old description, updated if the change differs; tmp/ is gitignored), then run exactly,
            in this order:
              git push -u origin ${{ env.NIGHTLY_BRANCH }}
              gh pr create --base main --head ${{ env.NIGHTLY_BRANCH }} --title "<subject>" --body-file tmp/nightly-pr.md
              gh pr close ${{ matrix.pr.number }} --delete-branch --comment "Redone on current main (<WHY, shortened>); replaced by <new PR URL>."

            ${{ env.TOOL_HINT }}

            No attribution anywhere: no Co-Authored-By trailers or "Generated with" lines.
          # The owner forbids attribution; the prompt says so too. dontAsk: a call no rule allows is denied, except the read-only ones Claude Code always allows.
          settings: |
            {"includeCoAuthoredBy": false, "attribution": {"commit": "", "pr": ""}, "permissions": {"defaultMode": "dontAsk"}}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(mix format:*),Bash(mix compile:*),Bash(mix usage_rules.docs:*),Bash(mix usage_rules.search_docs:*),Bash(mix credo:*),Bash(gh pr view ${{ matrix.pr.number }}),Bash(gh pr view ${{ matrix.pr.number }} *),Bash(gh pr diff ${{ matrix.pr.number }}),Bash(gh pr diff ${{ matrix.pr.number }} *),Bash(git push -u origin ${{ env.NIGHTLY_BRANCH }}),Bash(gh pr create --base main --head ${{ env.NIGHTLY_BRANCH }} *),Bash(gh pr close ${{ matrix.pr.number }} *)"
            --disallowedTools "${{ env.DENIED_TOOLS }}"
      - name: Summarize Claude's result
        if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        # .github/claude-summary.jq: only the final message and the denied calls (public repo). From
        # the run's commit, as Claude may have edited the checkout; a failed `git show` stops the step.
        run: |
          filter=$(git show "$GITHUB_SHA:.github/claude-summary.jq")
          jq -r "$filter" "$EXECUTION_FILE" >> "$GITHUB_STEP_SUMMARY"

  # Enforces the cap before any toolchain is set up. Runs even if an earlier job failed: the
  # count is still right, it just finds fewer slots.
  capacity:
    needs: [fix, recreate]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      has-slot: ${{ steps.count.outputs.has-slot }}
      prs: ${{ steps.count.outputs.prs }}
    steps:
      - name: Count open nightly PRs
        id: count
        # With pipefail, so a failed lookup in the pipeline below shows.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAX_OPEN_PRS: 3
        # Same-repo branches only: a fork can pick any branch name, and this repo is public.
        run: |
          prs=$(gh pr list --state all --limit 1000 --json number,title,state,headRefName,isCrossRepository \
            --jq '[.[] | select((.isCrossRepository | not) and (.headRefName | startswith("claude/nightly-"))) | {number, title, state}]')
          open=$(jq '[.[] | select(.state == "OPEN")] | length' <<< "$prs")
          echo "::notice::$open of $MAX_OPEN_PRS nightly PRs open"
          if [ "$open" -lt "$MAX_OPEN_PRS" ]; then has_slot=true; else has_slot=false; fi
          # Why each closed PR was declined: its maintainers' comments and reviews, and the closing
          # comment of claude[bot] or github-actions[bot] (by REST, whose logins tell bots from
          # users). Only theirs reach the prompt.
          recent=$(jq -c '.[:30]' <<< "$prs")
          # shellcheck disable=SC2016 # jq's $closed and $bots
          for number in $(jq -r '.[] | select(.state == "CLOSED") | .number' <<< "$recent"); do
            why=$(gh pr view "$number" --json closedAt,comments,reviews > "$RUNNER_TEMP/pr.json" &&
              gh api --paginate "repos/$GH_REPO/issues/$number/comments" \
                --jq '.[] | select(.user.type == "Bot" and (.user.login | IN("claude[bot]", "github-actions[bot]"))) | {body, createdAt: .created_at}' |
                jq -s . > "$RUNNER_TEMP/bots.json" &&
              jq -c --slurpfile bots "$RUNNER_TEMP/bots.json" '(.closedAt | fromdate) as $closed
                | [.comments[], .reviews[] | select(.authorAssociation | IN("OWNER", "MEMBER", "COLLABORATOR"))]
                  + [$bots[0][] | select((.createdAt | fromdate) >= $closed - 120)]
                | map(.body | gsub("\\s+"; " ") | .[:300] | select(. != ""))' "$RUNNER_TEMP/pr.json") ||
              { echo "::warning::Couldn't read why #$number was closed."; why='[]'; }
            recent=$(jq -c --argjson n "$number" --argjson why "$why" 'map(if .number == $n then . + {why: $why} else . end)' <<< "$recent")
          done
          {
            echo "has-slot=$has_slot"
            echo "prs=$recent"
          } >> "$GITHUB_OUTPUT"

  improve:
    needs: capacity
    # !cancelled(): the implicit success() would also fail on any failed or skipped job further up.
    if: ${{ !cancelled() && needs.capacity.outputs.has-slot == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # Exchanged for the Claude app token. PRs from GITHUB_TOKEN wouldn't trigger CI.
    env:
      # The run's only branch: the exact push and PR commands below allow no other, and GitHub
      # refuses a second PR for one head, so a run opens at most one.
      NIGHTLY_BRANCH: claude/nightly-${{ github.run_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Else checkout's read-only token can override the app token Claude pushes with: from v6
          # it sits in an includeIf file claude-code-action doesn't clear, so the push gets a 403.
          persist-credentials: false
          fetch-depth: 0
      # mise installs precompiled Erlang (builds.hex.pm) only on the Ubuntu runners it detects (up
      # to 24.04) and compiles it from source, ~5 min, on newer ones. Drop once it detects this one.
      - name: Use precompiled Erlang
        run: | # zizmor: ignore[github-env] (only the runner's ImageOS digits)
          if [[ "${ImageOS:-}" =~ ^ubuntu([0-9]{2})$ ]]; then echo "MISE_ERLANG_PRECOMPILED_OS=ubuntu-${BASH_REMATCH[1]}.04" >> "$GITHUB_ENV"; fi
      - name: Setup languages
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: Install dependencies and Playwright's source
        run: mix "do" deps.get, deps.compile, phoenix_test_playwright.playwright_source
      - run: git switch -c "$NIGHTLY_BRANCH"
      - name: Pick tonight's focus area
        id: focus
        # By day of the year, so successive nights look at different parts of the code.
        run: |
          areas=(
            "the public API: lib/phoenix_test/playwright.ex"
            "setup and browsers: case.ex, config.ex, internal/browser.ex"
            "selectors and helpers: selector.ex, internal/selector/, internal/cookie_args.ex, js_logger.ex"
            "the tests: test/phoenix_test/playwright/ and test/support/, outside the upstream mirrors"
          )
          area=${areas[$((10#$(date -u +%j) % ${#areas[@]}))]}
          echo "::notice::Focus: $area"
          echo "area=$area" >> "$GITHUB_OUTPUT"

      - name: Run Claude
        id: claude
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            BRANCH: ${{ env.NIGHTLY_BRANCH }} (already checked out)
            PREVIOUS NIGHTLY PRS, newest first: ${{ needs.capacity.outputs.prs }}
            FOCUS: ${{ steps.focus.outputs.area }}

            Find the single most valuable improvement to this codebase's simplicity or consistency
            and open one pull request for it, the kind a senior maintainer would be glad to merge.
            Pick it in or touching FOCUS: each night looks at a different part of the codebase.

            test/phoenix_test/upstream/ and test/support/upstream/web_app/ mirror upstream
            phoenix_test as a compatibility suite: leave them alone.

            1. Read AGENTS.md and enough of lib/ and test/ to know the prevailing patterns. Use
               subagents to survey separate areas in parallel.
            2. Look for duplicated logic that belongs in one place, dead code, needless indirection
               or options, and one concept handled or named differently across modules.
            3. Rank the candidates by how much simpler or more uniform the code becomes for how
               little it changes. Read the callers and tests of the best one before committing to
               it. Skip anything overlapping an OPEN PR above or repeating a CLOSED one: those were
               declined, and `why` holds the reasons people gave.
            4. Implement that one idea, matching the surrounding code. Prefer a diff that removes
               more than it adds.

            Limits: observable public behaviour stays the same. No new features, bug fixes,
            dependency, CI or changelog changes, and no changes that are only formatting, comments
            or renames to taste.

            Run `mix format`, `mix compile --warnings-as-errors` and `mix credo`; they must pass.
            Tests can't run here, in place of AGENTS.md's `mix check`: CI runs them on the PR, and
            a later nightly run fixes any failure.

            If nothing is clearly worth a maintainer's time, stop without pushing and say why. No
            PR is a good result; a marginal PR is not.

            To publish, commit with one imperative sentence as the subject (match `git log`), then
            run exactly:
              git push -u origin ${{ env.NIGHTLY_BRANCH }}
              gh pr create --base main --head ${{ env.NIGHTLY_BRANCH }} --title "<subject>" --body-file tmp/nightly-pr.md
            Write tmp/nightly-pr.md first (tmp/ is gitignored): a few sentences on what was
            inconsistent or complex and why this is simpler.

            ${{ env.TOOL_HINT }}

            No attribution anywhere: no Co-Authored-By trailers or "Generated with" lines.
          # The owner forbids attribution; the prompt says so too. dontAsk: a call no rule allows is denied, except the read-only ones Claude Code always allows.
          settings: |
            {"includeCoAuthoredBy": false, "attribution": {"commit": "", "pr": ""}, "permissions": {"defaultMode": "dontAsk"}}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 150
            --allowedTools "Read,Grep,Glob,Edit,Write,Agent,Task,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(mix format:*),Bash(mix compile:*),Bash(mix usage_rules.docs:*),Bash(mix usage_rules.search_docs:*),Bash(mix credo:*),Bash(git push -u origin ${{ env.NIGHTLY_BRANCH }}),Bash(gh pr create --base main --head ${{ env.NIGHTLY_BRANCH }} *)"
            --disallowedTools "${{ env.DENIED_TOOLS }}"
      - name: Summarize Claude's result
        if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        # .github/claude-summary.jq: only the final message and the denied calls (public repo). From
        # the run's commit, as Claude may have edited the checkout; a failed `git show` stops the step.
        run: |
          filter=$(git show "$GITHUB_SHA:.github/claude-summary.jq")
          jq -r "$filter" "$EXECUTION_FILE" >> "$GITHUB_STEP_SUMMARY"
